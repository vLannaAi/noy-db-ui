name: Peer floor

# Do all three packages actually COMPILE against the oldest @noy-db/* versions
# their peer ranges admit?
#
# Ported from noy-db-to (PR #92), klum-db (PR #87) and doi-db (PR #2).
#
# Deliberately NOT part of the main CI workflow: every gate there — build, lint,
# typecheck, 234 tests — resolves @noy-db/* from the exact DEV PIN, so none of
# them exercises the declared peer RANGES. A range can promise versions the code
# cannot run on and the whole suite stays green. klum-db shipped exactly that.
#
# Also enforces that the three packages declare the SAME floor. Their lockstep
# is not enforced by changesets (`fixed: []`) and holds only because every
# changeset so far cascaded through @noy-db/ui, so divergence is worth failing
# on rather than handling.
#
# examples/ are out of scope: private: true, outside the pnpm workspace, and
# they pin @noy-db/* as ordinary dependencies rather than peers. They are
# verified by `nuxi build`.

on:
  pull_request:
    paths: ['**/package.json', 'scripts/check-peer-floor.mjs', '.github/workflows/peer-floor.yml']
  push:
    branches: [main]
    paths: ['**/package.json', 'scripts/check-peer-floor.mjs', '.github/workflows/peer-floor.yml']
  workflow_dispatch:
  # Called by release.yml so the release path is gated on this too. Those path
  # filters above are invisible to a Release event — a Release is not a
  # package.json edit — so without this entry the guard sits merged in the repo
  # and watches a release ship a peer range it would have rejected. klum-db did
  # exactly that with 0.4.0-pre.5.
  workflow_call:
    inputs:
      ref:
        description: 'Ref to check out. The release TAG, not the default branch — otherwise this gates main while publishing something else.'
        required: false
        type: string

concurrency:
  # Keyed on the caller's event so a release-path run cannot share a group with
  # a standalone one. Note what is NOT the reason: a `release` event already
  # runs under the TAG (`github.ref` = refs/tags/vX.Y.Z), so it is isolated from
  # a push to main even without this key — but that is a property of how GitHub
  # sets `github.ref`, not something this config states or guarantees. The
  # genuinely reachable collisions are narrower: two push-triggered runs on the
  # same ref (a push touching both a package.json and a workflow file fires the
  # guard directly AND through release.yml), and, under workflow_dispatch, a
  # release-path run against a standalone one — both `refs/heads/main`.
  #
  # The second line is the one that matters. A job whose entire value is being
  # trusted to block a publish must not be cancellable by anything, which turns
  # the isolation above from a coincidence into a stated invariant. Cancelling
  # is scoped to superseded PR pushes, which is what it was for.
  group: peer-floor-${{ inputs.ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  peer-floor:
    name: Compile against the advertised floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable

      # No pnpm store cache on purpose: this job resolves @noy-db versions that
      # are NOT the dev pin, and a cache keyed on the lockfile would mask a
      # floor that cannot even be installed.
      - name: Install (dev pin)
        run: pnpm install --frozen-lockfile

      - name: Show the plan
        run: node scripts/check-peer-floor.mjs --dry-run

      - name: Compile against the declared floor
        run: node scripts/check-peer-floor.mjs
