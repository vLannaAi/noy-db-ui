name: Release

# Strict release pipeline for the three @noy-db/ui* packages.
#
# Design: docs/superpowers/specs/2026-08-09-release-trigger-design.md
#
# Triggered on GitHub Release `published`. Runs the full verification gate
# (install + build + lint + typecheck + test) on a clean checkout at the
# release tag, PLUS the peer-floor guard called at that same tag, and only
# publishes if every gate passes. Those two answer different questions: verify
# proves the tree is green against the exact dev pin, peer-floor proves the
# declared peer RANGES are true. Neither subsumes the other.
#
# ── Why a repo-level `vX.Y.Z` tag ─────────────────────────────────────
#
# This repo publishes with CHANGESETS, which tags each package separately
# (`@noy-db/ui@0.3.0-pre.5`, `@noy-db/ui-nuxt@0.3.0-pre.5`, …). A GitHub
# Release must hang off exactly one tag, and each cut produces three — so
# releases hang off a repo-level `vX.Y.Z` tag instead. Changesets' own
# per-package tags are still created and pushed, alongside it, unchanged.
# This makes `gh release list` read the same here as in noy-db /
# noy-db-to / klum-db, which is what the family coordination sweep expects.
#
# That tag CLAIMS all three packages sit at X.Y.Z, and nothing upstream
# enforces it: `.changeset/config.json` has `fixed: []` / `linked: []`.
# It has held only because every changeset so far touched `@noy-db/ui`,
# which cascades into both bindings via `updateInternalDependencies:
# "patch"`. A changeset touching ONLY `ui-nuxt` would split them. Hence the
# three-package version check in `verify` — see that step.
#
# ── npm dist-tag routing ──────────────────────────────────────────────
#
#   • `next`   — the in-flight pre-release line. Everything this repo has
#     ever published lives here.
#   • `latest` — curated stable releases. Currently parked at 0.3.0-pre.3.
#
# Routing rules:
#   - `release` event, prerelease: true  → `--tag next`
#   - `release` event, prerelease: false → `--tag latest`
#   - `workflow_dispatch`                → the `tag` input (default `next`)
#
# ── Release procedure ─────────────────────────────────────────────────
#
#   1. pnpm changeset            # author
#   2. pnpm changeset version    # bumps all three
#   3. merge to main
#   4. gh release create v0.3.0-pre.6 --target main --prerelease --generate-notes
#
# `gh release create` creates the tag, so there is no separate tagging step.
# Omitting `--prerelease` is what routes a stable cut to `@latest`.
#
# Setup (one-time, repo Settings → Secrets and variables):
#   - NPM_TOKEN — npm automation token with publish access to @noy-db/*
#   - DOCS_SYNC_TOKEN — fine-grained PAT with Issues:write on
#     vLannaAi/noy-db-docs, used ONLY by the docs-bridge job to file the
#     doc-sync issue. Absent it, the bridge still attaches its payload to the
#     Release and says plainly in the run summary that the notification half
#     was skipped — so a missing token degrades rather than fails.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm manual trigger'
        required: true
        default: ''
      tag:
        description: 'npm dist-tag. A pre-release MUST go to `next` — landing one on `latest` corrupts the tag for every consumer and only a manual `npm dist-tag` repair undoes it.'
        type: choice
        required: true
        default: next
        options: [next, latest]
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate 1: strict verification ──────────────────────────────────────
  verify:
    name: Verify (strict)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The repo-level tag asserts all three packages sit at this version, and
      # changesets does not enforce that (see the header). Check every package,
      # not just the anchor: checking only `ui` would let a `ui-nuxt`-only
      # changeset publish under a tag that misdescribes it.
      - name: Verify package versions match the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          FAILED=0
          for pkg in ui ui-nuxt ui-suai; do
            PKG_VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::@noy-db/$pkg is at $PKG_VERSION but the release tag is $VERSION"
              FAILED=1
            else
              echo "✅ @noy-db/$pkg@$PKG_VERSION matches release tag v$VERSION"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Release aborted: bump every package to $VERSION, or cut a tag that matches." >&2
            exit 1
          fi

      # Every version this repo has ever published is a semver pre-release, and
      # `@latest` is parked at 0.3.0-pre.3. Under a Release trigger the only
      # thing standing between a pre-release and `@latest` is an unticked
      # checkbox — and landing one there is not self-healing: it takes a manual
      # `npm dist-tag` repair, across three packages. @klum-db/lobby@latest is
      # currently rotten in exactly this way. Refuse the mismatch instead.
      - name: Refuse a semver pre-release routed to @latest
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [ "${{ github.event.release.prerelease }}" != "true" ] && [ "${VERSION#*-}" != "$VERSION" ]; then
            echo "::error::$VERSION is a semver pre-release, but this Release is not marked as a pre-release."
            echo "::error::Publishing would route it to @latest and corrupt the tag for all three packages."
            echo "::error::Tick 'Set as a pre-release' on the Release and re-run."
            exit 1
          fi
          echo "✅ routing check passed (version=$VERSION, prerelease=${{ github.event.release.prerelease }})"

  # ── Gate 2: the peer ranges are TRUE ─────────────────────────────────
  #
  # `verify` above proves the tree is green against the exact DEV PIN, which
  # says nothing about the declared peer RANGES — a range can promise versions
  # the code cannot run on and every gate stays green. That is not theoretical:
  # klum-db shipped 0.4.0-pre.5 advertising `^0.6.0-pre.0` while its code needed
  # `pre.14`, with this very guard already merged in its repo. It could not fire,
  # because `peer-floor.yml` triggers on `package.json` edits and a Release event
  # is not one.
  #
  # Called, not inlined. `peer-floor.yml` deliberately runs with NO pnpm store
  # cache and documents why next to the step; adding `run: node
  # scripts/check-peer-floor.mjs` to `verify` would put that job's cache in front
  # of it and quietly strip the property from the reason it exists.
  #
  # `ref` is required, not cosmetic: without it the called workflow checks out
  # the default branch, so a release would be gated against `main` while
  # publishing a tag — a check that runs and examines the wrong tree.
  peer-floor:
    name: Peer floor
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    uses: ./.github/workflows/peer-floor.yml
    with:
      ref: ${{ github.event.release.tag_name || github.ref }}

  # ── Gate 3: publish ──────────────────────────────────────────────────
  #
  # Explicit event guard: publish runs ONLY on a `release` event or a
  # `workflow_dispatch` with `confirm: PUBLISH`. `verify` also runs on `push`
  # to main when this file changes, so workflow edits get tested — but the
  # publish job must never run on that path, or editing this file could
  # publish to npm without confirmation.
  publish:
    name: Publish to npm
    needs: [verify, peer-floor]
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'PUBLISH')
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.dist_tag.outputs.tag }}
    permissions:
      contents: write   # push the git tags `changeset publish` creates
      id-token: write   # required for npm provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0 # full history + tags so `changeset publish` can create/push release tags

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Resolve the npm dist-tag once and echo it to the run summary before any
      # publish runs, so an unintended target is visible immediately. The
      # allowlist guards against a typo in the dispatch input.
      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              TAG="next"; REASON="release event, prerelease=true"
            else
              TAG="latest"; REASON="release event, prerelease=false"
            fi
          else
            TAG="${{ github.event.inputs.tag }}"; REASON="workflow_dispatch tag input"
          fi

          case "$TAG" in
            latest|next|canary|rc|beta|alpha) ;;
            *)
              echo "::error::Refusing to publish: tag '$TAG' is not in the allowlist (latest|next|canary|rc|beta|alpha)."
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### npm dist-tag"
            echo ""
            echo "- **Tag:** \`$TAG\`"
            echo "- **Reason:** $REASON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git identity
        # changesets creates ANNOTATED tags (`git tag -m`), which fail with exit 128 on a
        # runner with no committer identity — and changesets discards the exit code after
        # logging "New tag", so the failure is silent and the tag push finds nothing.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check npm auth (whoami)
        run: |
          WHOAMI=$(npm whoami 2>&1) && echo "npm user: $WHOAMI" || echo "npm whoami failed: $WHOAMI"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      # `changeset publish` takes no --provenance flag (verified against 2.31.0:
      # nothing under node_modules/@changesets/ mentions provenance). It shells
      # out to `pnpm publish`, so provenance is requested via the npm config env
      # var below plus `id-token: write` on this job.
      #
      # UNVERIFIED end to end — the first Release-triggered cut must be checked
      # for the attestation badge on npmjs.com. If the var does not reach npm,
      # provenance is silently absent rather than broken, and workflow_dispatch
      # remains as the fallback publish route.
      - name: Publish
        run: pnpm release # = pnpm build && changeset publish --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
          NPM_CONFIG_PROVENANCE: true

      - name: Push release tags
        # `changeset tag` is idempotent (skips tags that exist locally or on the remote),
        # so this also back-fills tags for any release where tagging failed.
        run: |
          pnpm exec changeset tag
          git push origin --tags

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo ""
            echo "- Release: \`${{ github.event.release.tag_name || github.ref_name }}\`"
            echo "- npm dist-tag: \`${{ steps.dist_tag.outputs.tag }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Gate 4 is not a gate: notify noy-db-docs ─────────────────────────
  #
  # `noy-db-docs/docs.manifest.json` carries `channels.next.noy-db-ui` and
  # `channels.latest.noy-db-ui` — docs RECORDS this repo's versions but, until
  # this job existed, had no way to learn when they changed. Every ui release
  # depended on someone remembering to hand-edit that manifest: a claim nothing
  # executed. noy-db and noy-db-to have carried this bridge for months; this is
  # the port. klum-db has none, correctly — docs does not track it.
  #
  # `continue-on-error: true` is deliberate and load-bearing: a docs-side
  # outage must never fail a publish that already succeeded. The side effect is
  # that "non-fatal" and "invisible" become the same setting — noy-db-to lost
  # two releases to a bridge that threw while both runs reported success
  # (noy-db-to#93). Hence the failure step at the end, which writes a loud block
  # to the run summary and cannot affect the publish.
  docs-bridge:
    name: Docs bridge payload
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Space-separated npm dist-tags currently synced to docs. Pre-1.0: `next`
      # only — `@latest` is parked at 0.3.0-pre.3 and is not a synced rail.
      DOC_SYNC_CHANNELS: next
    permissions:
      contents: write   # gh release upload
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      # No pnpm install and no build: build-payload.mjs reads package.json and
      # CHANGELOG.md with plain node, and shells to `npm view` for first-publish
      # detection. Nothing here imports the workspace, so there is no dist to
      # build and no lockfile to resolve — fewer failure modes in a job whose
      # failures are non-fatal and therefore easy to miss.
      - name: Build payload
        run: |
          set -euo pipefail
          node scripts/docs-bridge/build-payload.mjs \
            --tag '${{ github.event.release.tag_name }}' \
            --channel '${{ needs.publish.outputs.dist_tag }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            > /tmp/docs-bridge.json
          node -e "
            const p = require('/tmp/docs-bridge.json');
            if (p.bridge !== 1 || !Array.isArray(p.packages) || p.packages.length === 0) {
              console.error('payload failed its own schema check'); process.exit(1);
            }
            console.log('payload ok:', p.packages.length, 'packages at', p.version);
          "

      - name: Attach payload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" /tmp/docs-bridge.json --clobber

      - name: Open or update the doc-sync issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          CHANNEL="${{ needs.publish.outputs.dist_tag }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ASSET_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/docs-bridge.json"

          # Gate (a): the token exists. Without this the failure surfaces as an
          # opaque gh auth error; the payload asset is attached either way, so
          # say plainly that only the notification half is missing.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "⚠️ No doc-sync issue filed: the DOCS_SYNC_TOKEN secret is not set on this repo. The payload asset IS attached to the release, so the sync can still be run manually against it. Fix: add a fine-grained PAT with Issues:write on vLannaAi/noy-db-docs." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Gate (b): active rail. DOC_SYNC_CHANNELS is space-separated.
          if ! echo " $DOC_SYNC_CHANNELS " | grep -q " $CHANNEL "; then
            echo "No doc-sync issue opened: channel '$CHANNEL' is parked (DOC_SYNC_CHANNELS=\"$DOC_SYNC_CHANNELS\"). Payload asset is still attached to the release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Gate (c): real delta. An all-version-only payload with no changelog
          # text anywhere is not worth an issue.
          if ! node --input-type=module -e "
            import { hasRealDelta } from './scripts/docs-bridge/build-payload.mjs'
            import { readFileSync } from 'node:fs'
            process.exit(hasRealDelta(JSON.parse(readFileSync('/tmp/docs-bridge.json', 'utf8'))) ? 0 : 1)
          "; then
            echo "No doc-sync issue opened: payload has no delta (every package is version-only with no changelog) on channel '$CHANNEL'. Payload asset is still attached to the release." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "Release \`$TAG\` was just published to npm dist-tag \`$CHANNEL\`."
            echo ""
            echo "- Channel: \`$CHANNEL\`"
            echo "- Run: $RUN_URL"
            echo "- Machine-readable payload (schema \`bridge: 1\`): $ASSET_URL"
            echo ""
            echo "Per-package classification (from the payload):"
            node -e "
              const p = require('/tmp/docs-bridge.json');
              const verb = { added: 'ADD', updated: 'UPDATE', 'version-only': 'VERSION-ONLY' };
              for (const x of p.packages) {
                console.log(\`- **\${verb[x.changeType]}** \\\`\${x.name}@\${x.version}\\\` (hub peer \\\`\${x.hubPeerRange ?? 'n/a'}\\\`)\`);
              }
            "
            echo ""
            echo "noy-db-docs pins no \`@noy-db/ui*\` package, so this is a \`channels\` update in \`docs.manifest.json\`, not a dependency bump. Run the doc-sync against the payload with \`--bridge-repo vLannaAi/noy-db-ui --bridge-tag $TAG\`, or pass the downloaded asset directly with \`--bridge <file>\`."
          } > /tmp/bridge-comment.md

          cat /tmp/bridge-comment.md >> "$GITHUB_STEP_SUMMARY"

          NUM=$(gh issue list -R vLannaAi/noy-db-docs --state open --limit 20 \
            --search "doc-sync needed: $TAG @$CHANNEL in:title" \
            --json number,title --jq ".[] | select(.title == \"doc-sync needed: $TAG @$CHANNEL\") | .number" | head -1)

          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R vLannaAi/noy-db-docs --body-file /tmp/bridge-comment.md
          else
            gh issue create -R vLannaAi/noy-db-docs \
              --title "doc-sync needed: $TAG @$CHANNEL" \
              --body-file /tmp/bridge-comment.md
          fi

      # Runs only on failure. `continue-on-error` has already swallowed the
      # failure at job level, so this cannot affect the publish — it exists
      # purely so a red bridge is not indistinguishable from a green one.
      - name: Surface a bridge failure in the run summary
        if: failure()
        run: |
          {
            echo "## ⚠️ Docs bridge FAILED — the publish succeeded, this did not"
            echo ""
            echo "\`docs-bridge.json\` was **not** attached to \`${{ github.event.release.tag_name }}\`,"
            echo "and no doc-sync issue was filed in noy-db-docs."
            echo ""
            echo "The publish itself is unaffected and needs no action."
            echo ""
            echo "The payload derives its package set from \`packages/\` with no wiring table, so the"
            echo "\"new package missing from the table\" failure that hit noy-db-to twice cannot occur"
            echo "here. Likelier causes: the three packages fell out of lockstep (the payload carries"
            echo "one version and refuses to misdescribe the others), a CHANGELOG heading format"
            echo "change that \`scripts/docs-bridge/changelog.mjs\` no longer matches, or npm being"
            echo "unreachable for the first-publish check."
            echo ""
            echo "Reproduce locally:"
            echo "\`\`\`"
            echo "node scripts/docs-bridge/build-payload.mjs --tag ${{ github.event.release.tag_name }} --channel next --run-url local"
            echo "pnpm test:scripts"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
