name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Lint · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enable corepack (pnpm)
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # scripts/ is not part of any published package, so `turbo run test` does
      # not reach it. Without this line the docs-bridge tests would exist and
      # never run — the same shape as the bridge gap they were written for.
      - name: Test repo tooling (scripts/)
        run: pnpm test:scripts
